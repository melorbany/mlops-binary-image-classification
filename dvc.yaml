stages:
  download:
    cmd: python -m src.data.download
    deps:
      - src/data/download.py
    outs:
      - data/raw:
          cache: true
          persist: true

  preprocess:
    cmd: python -m src.data.preprocess
    deps:
      - src/data/preprocess.py
      - data/raw
    params:
      - params.yaml:
          - preprocess.image_size
          - preprocess.train_ratio
          - preprocess.val_ratio
          - preprocess.seed
    outs:
      - data/processed:
          cache: true
          persist: true

  train:
    cmd: python -m src.models.train
    deps:
      - src/models/train.py
      - data/processed
    params:
      - params.yaml:
          - train.epochs
          - train.batch_size
          - train.learning_rate
          - train.num_workers
    outs:
      - models/model.pt:
          cache: true
