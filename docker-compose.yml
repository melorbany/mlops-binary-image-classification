services:
  api:
    image: ${DOCKER_IMAGE:-cats-vs-dogs:latest}
    container_name: ${APP_CONTAINER_NAME:-cats-vs-dogs-api}
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MODEL_PATH=/app/models/model.pt
      - IMAGE_SIZE=64
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
